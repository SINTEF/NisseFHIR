[package]
name = "fhir_server"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
fluent-uri = "0.4.1"
http = "1.3"
json-patch = "4.1"
jsonschema = "0.49"
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-helmet = "0.3"
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "compression-gzip", "compression-br", "compression-deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"

[dev-dependencies]
http-body-util = "0.1"
libc = "0.2"
tower = "0.5"

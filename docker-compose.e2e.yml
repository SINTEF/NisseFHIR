name: nissefhir-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fhir_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fhir_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - nissefhir-e2e-postgres:/var/lib/postgresql

  fhir-server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fhir_e2e
      BIND_ADDR: 0.0.0.0:8080
      JWT_MODE: "static"
      JWT_SECRET: e2e-secret-0123456789abcdefghijkl
      FHIR_BASE_URL: http://127.0.0.1:18080/fhir
      SERVE_DOCS: "false"
      RUST_LOG: fhir_server=info,tower_http=info
    ports:
      - "18080:8080"

volumes:
  nissefhir-e2e-postgres:

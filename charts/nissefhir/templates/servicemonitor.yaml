{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- /* The ServiceMonitor CRD is owned by the Prometheus Operator and is NOT
     installed by this chart. Enabling metrics.serviceMonitor.enabled therefore
     requires that CRD to already exist in the cluster. */ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nissefhir.fullname" . }}
  labels:
    {{- include "nissefhir.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "nissefhir.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}

{{- if .Values.config.jwtSecret.create }}
{{- $secretName := include "nissefhir.jwtSecretName" . }}
{{- $secretKey := include "nissefhir.jwtSecretKey" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $generatedSecret := randAlphaNum 64 }}
{{- $jwtSecretValue := .Values.config.jwtSecret.value | default "" }}
{{- if and (empty $jwtSecretValue) $existingSecret }}
  {{- $jwtSecretValue = (index $existingSecret.data $secretKey | b64dec) | default "" }}
{{- end }}
{{- if empty $jwtSecretValue }}
  {{- $jwtSecretValue = $generatedSecret }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "nissefhir.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $secretKey }}: {{ $jwtSecretValue | quote }}
{{- end }}

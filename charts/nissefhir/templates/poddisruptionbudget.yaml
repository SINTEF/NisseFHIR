{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nissefhir.fullname" . }}
  labels:
    {{- include "nissefhir.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nissefhir.selectorLabels" . | nindent 6 }}
  {{- if hasKey .Values.podDisruptionBudget "minAvailable" }}
  minAvailable: {{ index .Values.podDisruptionBudget "minAvailable" }}
  {{- end }}
  {{- if hasKey .Values.podDisruptionBudget "maxUnavailable" }}
  maxUnavailable: {{ index .Values.podDisruptionBudget "maxUnavailable" }}
  {{- end }}
{{- end }}

replicaCount: 1

# PodDisruptionBudget
# Protects against voluntary disruptions (e.g. node drains, autoscaling) taking
# down every replica at once. Disabled by default so single-replica installs
# are unaffected.
#
# When enabled, set exactly one of minAvailable or maxUnavailable. Both accept
# an integer replica count or a percentage string such as "50%". Setting both
# (or neither) is rejected at render time.
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: "25%"

image:
  repository: ghcr.io/sintef/nissefhir
  pullPolicy: IfNotPresent
  tag: ""
  # digest: ""

# imagePullSecrets:
#   - name: registry-creds

# nameOverride: ""
# fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  # name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  annotations: {}
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  # className: ""
  annotations: {}
  hosts:
    - host: nissefhir.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  # FHIR base URL visible to clients (used for absolute references in bundles)
  # fhirBaseUrl: "https://fhir.example.com/fhir"

  # JWT authentication mode: "static" (symmetric HS256) or "jwks" (RS256 via JWKS endpoint).
  # The server does not implement a "none" mode; defaulting to it would prevent startup.
  jwtMode: "static"
  # JWT secret delivery for JWT_MODE=static.
  # Prefer existingSecret for production. Set create=true to have the chart create a Secret.
  jwtSecret:
    create: true
    key: jwt-secret
    # value: ""
    delivery: env
    mountPath: /var/run/secrets/nissefhir
    existingSecret:
      # name: my-secret
      key: jwt-secret
  # jwksUrl: ""

  # Serve Swagger/OpenAPI docs
  serveDocs: "false"

  # Graceful-shutdown drain window in seconds (maps to SHUTDOWN_TIMEOUT_SECS).
  # The server stops accepting connections on SIGTERM and waits up to this
  # bound for in-flight requests before forcing exit.
  shutdownTimeoutSecs: "10"

  # PostgreSQL connection-pool settings (maps to DB_POOL_* env vars).
  # Leave unset (or empty) to use the server defaults.
  # dbPoolMinConnections: "1"
  # dbPoolMaxConnections: "10"
  # dbPoolIdleTimeoutSecs: "600"
  # dbPoolMaxLifetimeSecs: "3600"

  # Rust log level
  rustLog: "fhir_server=info,tower_http=info"

# CloudNativePG Cluster configuration
# Requires the CloudNativePG operator to be installed in the cluster.
cnpg:
  enabled: true
  instances: 1
  # PostgreSQL image
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 8Gi
    # storageClass: ""
  resources: {}
  #   requests:
  #     cpu: 100m
  #     memory: 256Mi
  #   limits:
  #     cpu: "1"
  #     memory: 1Gi
  postgresql:
    parameters: {}
    #   max_connections: "200"
    #   shared_buffers: "256MB"
  monitoring:
    enabled: false
  backup:
    enabled: false
    # barmanObjectStore:
    #   destinationPath: "s3://my-bucket/backups"
    #   s3Credentials:
    #     accessKeyId:
    #       name: aws-creds
    #       key: ACCESS_KEY_ID
    #     secretAccessKey:
    #       name: aws-creds
    #       key: SECRET_ACCESS_KEY
    # retentionPolicy: "30d"

  # Use an external database instead of CNPG-managed cluster
  # When cnpg.enabled is false, set these to connect to an external PostgreSQL.
  # externalDatabase:
  #   url: "postgres://user:password@host:5432/fhir"
  #   existingSecret:
  #     name: my-db-secret
  #     key: database-url

extraEnv: []
# - name: RUST_LOG
#   value: debug

# Prometheus metrics on a dedicated telemetry listener.
#
# The telemetry listener is intentionally separate from the FHIR router and is
# NOT exposed through the public ingress. It is unauthenticated for Prometheus
# compatibility and must be protected by cluster networking / firewalls.
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    # Enabling this requires the Prometheus Operator's ServiceMonitor CRD to
    # exist in the cluster; it is not installed by this chart.
    enabled: false
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s

resources: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

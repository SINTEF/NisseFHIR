name: nissefhir

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fhir
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fhir"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - nissefhir-postgres:/var/lib/postgresql

  fhir-server:
    image: ghcr.io/sintef/nissefhir:0.1.4
    # To build locally instead, comment out 'image' above and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fhir
      BIND_ADDR: 0.0.0.0:8080
      JWT_MODE: "static"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting docker-compose}
      FHIR_BASE_URL: http://localhost:8080/fhir
      SERVE_DOCS: "true"
      RUST_LOG: fhir_server=info,tower_http=info
      # Prometheus metrics on a dedicated telemetry listener (default on).
      METRICS_ENABLED: "true"
      METRICS_BIND_ADDR: 0.0.0.0:9090
    ports:
      - "8080:8080"
      # Prometheus metrics endpoint for local inspection:
      #   curl --fail http://localhost:9090/metrics
      - "9090:9090"

volumes:
  nissefhir-postgres:

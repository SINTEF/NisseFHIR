name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fhir_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fhir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fhir_test
        run: cargo test --workspace --all-features

  helm:
    name: Helm Chart Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint charts/nissefhir

      - name: Render tests
        run: |
          charts/nissefhir/tests/test_pdb_render.sh
          charts/nissefhir/tests/test_metrics_render.sh
          charts/nissefhir/tests/test_values_validation.sh

  docker-amd64:
    name: Docker Build AMD64
    runs-on: ubuntu-latest
    needs:
      - rust
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Generate AMD64 tags
        id: amd64-tags
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          AMD64_TAGS=$(echo "$TAGS" | sed 's/$/-amd64/')
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$AMD64_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push AMD64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.amd64-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  docker-arm64:
    name: Docker Build ARM64
    runs-on: ubuntu-24.04-arm
    needs:
      - rust
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Generate ARM64 tags
        id: arm64-tags
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          ARM64_TAGS=$(echo "$TAGS" | sed 's/$/-arm64/')
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$ARM64_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push ARM64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arm64-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  docker-manifest:
    name: Docker Multi-arch Manifest
    runs-on: ubuntu-latest
    needs:
      - docker-amd64
      - docker-arm64
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create and push multi-arch manifest
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Creating manifest for: $TAG"
            docker buildx imagetools create -t "$TAG" \
              "${TAG}-amd64" \
              "${TAG}-arm64"
          done

  e2e:
    name: E2E (${{ matrix.mode }}, ${{ github.event_name == 'schedule' && 'full' || 'smoke' }})
    runs-on: ubuntu-24.04-arm
    needs:
      - rust
    strategy:
      fail-fast: false
      matrix:
        mode: [native, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout full-example fixtures
        if: github.event_name == 'schedule'
        run: git submodule update --init --depth 1 references/fhir-test-cases

      - name: Cache FHIR examples
        uses: actions/cache@v6
        with:
          path: examples/examples-json.zip
          key: fhir-examples-7bbba6b4d9dbd812a93e9dedb97ff0d8bd902525a5e628071a0add302a0700d5

      - name: Run E2E harness
        env:
          E2E_ARTIFACTS_DIR: e2e-artifacts
        run: |
          mkdir -p e2e-artifacts
          dataset="smoke"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            dataset="all-plus-smoke"
          fi
          set +e
          python3 scripts/e2e_examples.py \
            --mode "${{ matrix.mode }}" \
            --native-db docker \
            --dataset "$dataset" 2>&1 | tee e2e-artifacts/harness.log
          status=${PIPESTATUS[0]}
          jq -n \
            --arg mode "${{ matrix.mode }}" \
            --arg dataset "$dataset" \
            --argjson exit_code "$status" \
            '{mode: $mode, dataset: $dataset, exit_code: $exit_code, success: ($exit_code == 0)}' \
            > e2e-artifacts/result.json
          exit "$status"

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-${{ matrix.mode }}-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: error

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
